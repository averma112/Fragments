version: '3.9'

services:
  fragments:
    init: true
    build: .
    container_name: fragments-fragments-1
    environment:
      - API_URL=http://localhost:8080
      - HTPASSWD_FILE=tests/.htpasswd
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - NODE_ENV=development

      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_SESSION_TOKEN=test

      # S3 (LocalStack)
      - AWS_S3_ENDPOINT_URL=http://localstack:4566
      - AWS_S3_BUCKET_NAME=fragments

      # DynamoDB Local
      - AWS_DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
      - AWS_DYNAMODB_TABLE_NAME=fragments

    ports:
      - '8080:8080'
    depends_on:
      - dynamodb-local
      - localstack

  # DynamoDB Local, see: https://hub.docker.com/r/amazon/dynamodb-local
  dynamodb-local:
    image: amazon/dynamodb-local
    container_name: fragments-dynamodb-local-1
    ports:
      - '8000:8000'
    # In-memory only, no disk
    command: ['-jar', 'DynamoDBLocal.jar', '-inMemory']

  # LocalStack, used here only for S3
  localstack:
    image: localstack/localstack
    container_name: fragments-localstack-1
    ports:
      - '4566:4566'
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1