version: '3.9'

services:
  fragments:
    init: true
    build: .
    container_name: fragments-fragments-1
    environment:
      - API_URL=http://localhost:8080
      # Remove HTPASSWD_FILE to use Cognito instead of Basic Auth
      # - HTPASSWD_FILE=tests/.htpasswd
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - NODE_ENV=development

      # Cognito configuration
      - AWS_COGNITO_POOL_ID=${AWS_COGNITO_POOL_ID:-us-east-1_mWEmrcXtI}
      - AWS_COGNITO_CLIENT_ID=${AWS_COGNITO_CLIENT_ID:-8o2l6geft81bg9dajjaqtuicj}

      # Real AWS credentials from your environment
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}

      # Real AWS S3 (not LocalStack)
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-averma112-fragments}

      # Real AWS DynamoDB (not DynamoDB Local)
      - AWS_DYNAMODB_TABLE_NAME=${AWS_DYNAMODB_TABLE_NAME:-fragments}

    ports:
      - '8080:8080'

  # Removed DynamoDB Local and LocalStack - using real AWS services
