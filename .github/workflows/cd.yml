name: CD

on:
  push:
    # Run CD only when you push a tag like v0.9.85
    tags:
      - "v*.*.*"

jobs:
  deploy:
    name: Build, Push to Docker Hub, Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Login to Docker Hub (uses existing secrets)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3) Build & push image to Docker Hub
      #    Tags: <username>/fragments:<tag> and :latest
      - name: Build and push Docker image to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION_TAG: ${{ github.ref_name }}   # e.g. v0.9.85
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/fragments:${{ env.VERSION_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/fragments:latest

      # 4) Configure AWS credentials (Learner Lab keys)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 5) Update ECS task definition to use the new Docker Hub image
      - name: Render ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION_TAG: ${{ github.ref_name }}
        with:
          # This file is the JSON you downloaded from ECS and committed
          task-definition: fragments-definition.json

          # MUST match the container name in that JSON
          # (from the walkthrough this is usually "fragments-container")
          container-name: fragments-container

          # Use the new Docker Hub image for this tag
          image: ${{ env.DOCKERHUB_USERNAME }}/fragments:${{ env.VERSION_TAG }}

          # NOTE: we are NOT overriding environment-variables here.
          # ECS will keep whatever env vars are already in fragments-definition.json.

      # 6) Deploy updated task definition to ECS
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: fragments-cluster
          service: fragments-service
          wait-for-service-stability: true
