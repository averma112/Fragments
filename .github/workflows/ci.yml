name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------- UNIT TESTS -----------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: test

      - name: Create test environment file
        run: |
          cat > .env.test << 'EOL'
          NODE_ENV=test
          PORT=8080
          API_URL=http://localhost:8080
          DB_FILE=:memory:
          REDIS_URL=redis://localhost:6379
          SESSION_SECRET=test-secret
          EOL
          cat .env.test  # Print the file for debugging

      - name: Run tests with coverage
        run: npm run coverage
        env:
          NODE_ENV: test
          PORT: '8080'
          DB_FILE: ':memory:'
          REDIS_URL: 'redis://localhost:6379'
          SESSION_SECRET: 'test-secret'

      - name: Upload coverage to Codecov
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN || '' }}
          file: ./coverage/lcov.info

  # ----------------- INTEGRATION TESTS -----------------
  integration-tests:
    name: Integration Tests (Docker + Hurl + Local AWS)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Hurl (official installer)
        run: |
          curl -sSfL https://hurl.dev/install.sh | sudo bash

      - name: Install AWS CLI (via pip)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install --user awscli
        env:
          PIP_ROOT_USER_ACTION: ignore

      - name: Add AWS CLI to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build and start Docker Compose stack
        run: docker compose up --build -d

      - name: Setup local AWS resources (S3 + DynamoDB)
        run: ./scripts/local-aws-setup.sh

      - name: Wait for fragments API to be ready
        run: |
          echo "Waiting for http://localhost:8080 to be ready..."
          for i in {1..30}; do
            if curl -sSf http://localhost:8080/ > /dev/null; then
              echo "✅ API is up!"
              exit 0
            fi
            echo "⏳ Still waiting for API... ($i/30)"
            sleep 2
          done
          echo "❌ API did not become ready in time"
          echo "---- docker ps ----"
          docker ps
          echo "---- fragments logs ----"
          docker logs fragments-fragments-1 || true
          exit 1

      - name: Run integration tests (Hurl)
        run: npm run test:integration

  # ----------------- DOCKER BUILD & PUSH -----------------
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, integration-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fragments
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
